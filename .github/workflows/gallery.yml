name: Validate theme gallery
on:
  pull_request:
    paths:
      - 'docs/gallery/**'
      - 'src/core/gallery/**'
      - 'src/core/ai/**'
      - 'src/core/css/**'
      - 'src/core/tokens/**'
      - 'scripts/gallery-index.ts'
      - 'package*.json'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gallery -- --check
      - run: npm test -- --run src/core/gallery/catalog.test.ts scripts/gallery-index.test.ts
