name: Validate theme gallery
on:
  pull_request:
    paths:
      - 'docs/gallery/packs/**'
      - 'docs/gallery/**'
      - 'src/core/gallery/**'
      - 'src/core/ai/**'
      - 'src/core/css/**'
      - 'src/core/tokens/**'
      - 'scripts/gallery-index.ts'
      - 'package*.json'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/gallery-index.ts --check
      - run: npx vitest run src/core/gallery/catalog.test.ts scripts/gallery-index.test.ts
